name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Betterleaks
        env:
          BETTERLEAKS_SHA256: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a
          BETTERLEAKS_VERSION: 1.8.1
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan Git history
        run: betterleaks git . --redact --verbose
