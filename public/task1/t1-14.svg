<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="#fbf8f2"/>
  <g font-family="Arial, sans-serif" fill="#1f1a14">
    <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700">University student accommodation, 2025</text>
    <text x="310" y="88" text-anchor="middle" font-size="19" font-weight="700">Cost and journey to campus</text>
    <g transform="translate(45 115)"><rect width="530" height="330" rx="5" fill="#fffdf9" stroke="#cfc5b6" stroke-width="2"/><rect width="530" height="70" fill="#1f4d4a"/><g fill="#fff" font-size="15" font-weight="700" text-anchor="middle"><text x="105" y="42">Type</text><text x="295" y="31">Monthly cost</text><text x="295" y="51">($)</text><text x="445" y="31">Journey</text><text x="445" y="51">(minutes)</text></g><g stroke="#ddd4c6"><path d="M0 135H530M0 200H530M0 265H530M210 0V330M380 0V330"/></g><g font-size="17" text-anchor="middle"><text x="105" y="110">Campus hall</text><text x="295" y="110">720</text><text x="445" y="110">5</text><text x="105" y="175">Shared flat</text><text x="295" y="175">580</text><text x="445" y="175">22</text><text x="105" y="240">Studio</text><text x="295" y="240">940</text><text x="445" y="240">18</text><text x="105" y="305">Host family</text><text x="295" y="305">650</text><text x="445" y="305">35</text></g></g>
    <text x="775" y="88" text-anchor="middle" font-size="19" font-weight="700">Student satisfaction</text>
    <g transform="rotate(-90 775 275)" fill="none" stroke-width="95"><circle cx="775" cy="275" r="105" stroke="#1f4d4a" stroke-dasharray="362.8 296.9"/><circle cx="775" cy="275" r="105" stroke="#a6a05a" stroke-dasharray="204.5 455.2" stroke-dashoffset="-362.8"/><circle cx="775" cy="275" r="105" stroke="#b56b36" stroke-dasharray="92.4 567.3" stroke-dashoffset="-567.3"/></g>
    <g text-anchor="middle" font-size="15" font-weight="700"><text x="775" y="271">All students</text><text x="775" y="294">1,200 surveyed</text></g>
    <g font-size="15"><rect x="635" y="430" width="18" height="18" fill="#1f4d4a"/><text x="662" y="444">Satisfied 55%</text><rect x="635" y="468" width="18" height="18" fill="#a6a05a"/><text x="662" y="482">Neutral 31%</text><rect x="635" y="506" width="18" height="18" fill="#b56b36"/><text x="662" y="520">Dissatisfied 14%</text></g>
  </g>
