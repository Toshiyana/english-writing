    <g stroke="#cfc5b6" fill="#fffdf9"><rect x="90" y="92" width="820" height="420"/><path d="M90 152H910M90 212H910M90 272H910M90 332H910M90 392H910M90 452H910M315 92V512M535 92V512M720 92V512"/></g>
