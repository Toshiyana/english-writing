    <g font-size="16" text-anchor="middle"><text x="132" y="205">1. Cherries</text><text x="132" y="230">harvested</text><text x="322" y="205">2. Dried</text><text x="322" y="230">in the sun</text><text x="502" y="205">3. Beans</text><text x="502" y="230">hulled</text><text x="682" y="205">4. Sorted</text><text x="682" y="230">by quality</text><text x="870" y="205">5. Roasted</text><text x="870" y="230">at 200°C</text><text x="870" y="395">6. Ground</text><text x="870" y="420">if required</text><text x="615" y="395">7. Packaged</text><text x="615" y="420">for sale</text></g>
