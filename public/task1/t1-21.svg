<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="#fbf8f2"/>
  <g font-family="Arial, sans-serif" fill="#1f1a14">
    <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700">Exercise habits among adults, 2025</text><text x="40" y="90" font-size="14">exercise weekly (%)</text>
    <g stroke="#ddd4c6"><path d="M90 440H570M90 370H570M90 300H570M90 230H570M90 160H570M90 90H570"/></g>
    <g fill="#6b6258" font-size="13" text-anchor="end"><text x="78" y="445">0</text><text x="78" y="375">20</text><text x="78" y="305">40</text><text x="78" y="235">60</text><text x="78" y="165">80</text><text x="78" y="95">100</text></g>
    <g fill="#1f4d4a"><rect x="125" y="167" width="70" height="273"/><rect x="240" y="202" width="70" height="238"/><rect x="355" y="244" width="70" height="196"/><rect x="470" y="279" width="70" height="161"/></g>
    <g font-size="14" text-anchor="middle"><text x="160" y="468">18–29</text><text x="275" y="468">30–44</text><text x="390" y="468">45–59</text><text x="505" y="468">60+</text></g>
    <g stroke="#cfc5b6" fill="#fffdf9"><rect x="610" y="90" width="340" height="350"/><path d="M610 160H950M610 230H950M610 300H950M610 370H950M755 90V440"/></g><rect x="610" y="90" width="340" height="70" fill="#1f4d4a"/>
    <g fill="#fff" font-size="14" font-weight="700" text-anchor="middle"><text x="682" y="118">Age</text><text x="682" y="138">group</text><text x="852" y="112">Average session</text><text x="852" y="133">/ preferred activity</text></g>
    <g font-size="14" text-anchor="middle"><text x="682" y="202">18–29</text><text x="852" y="193">52 min</text><text x="852" y="213">Gym</text><text x="682" y="272">30–44</text><text x="852" y="263">44 min</text><text x="852" y="283">Running</text><text x="682" y="342">45–59</text><text x="852" y="333">39 min</text><text x="852" y="353">Cycling</text><text x="682" y="412">60+</text><text x="852" y="403">35 min</text><text x="852" y="423">Walking</text></g>
    <text x="500" y="555" text-anchor="middle" font-size="14" fill="#6b6258">Weekly exercise means at least one session of 30 minutes.</text>
  </g>
</svg>
